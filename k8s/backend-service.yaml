  namespace: pulse-attendance
  labels:
    app: pulse-backend
    app.kubernetes.io/name: pulse-backend
    app.kubernetes.io/part-of: pulse-attendance
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app: pulse-backend
  ports:
