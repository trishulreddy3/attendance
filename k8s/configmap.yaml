apiVersion: v1
kind: ConfigMap
metadata:
  name: pulse-config
  namespace: pulse-attendance
  labels:
    app.kubernetes.io/part-of: pulse-attendance
data:
  # Backend runtime configuration
  PORT: "8080"
  SPRING_PROFILES_ACTIVE: "prod"
  ATTENDANCE_DEFAULT_RADIUS: "30"

  # Frontend runtime configuration
  FRONTEND_PORT: "3000"
  HOST: "0.0.0.0"
  NODE_ENV: "production"
  VITE_API_BASE_URL: "/api"
  VITE_WS_URL: "/ws"
