apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pulse-ingress
  namespace: pulse-attendance
  labels:
    app.kubernetes.io/part-of: pulse-attendance
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/websocket-services: "pulse-backend-service"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # Spring Boot Backend API routes
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: pulse-backend-service
                port:
                  number: 8080
          # Real-time WebSocket routes
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: pulse-backend-service
                port:
                  number: 8080
          # Frontend SSR and static application routes
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pulse-frontend-service
                port:
                  number: 3000
