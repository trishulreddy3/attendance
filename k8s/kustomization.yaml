apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pulse-attendance

labels:
  - pairs:
      app.kubernetes.io/part-of: pulse-attendance

resources:
  - namespace.yaml
  - configmap.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
  - ingress.yaml

images:
  - name: ghcr.io/trishulreddy3/pulse-backend
    newTag: latest
  - name: ghcr.io/trishulreddy3/pulse-frontend
    newTag: latest
