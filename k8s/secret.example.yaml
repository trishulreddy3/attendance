# ==============================================================================
# Kubernetes Secret Template (Example)
#
# DO NOT COMMIT REAL PRODUCTION SECRETS OR PASSWORDS TO SOURCE CONTROL!
#
# How to apply in your cluster:
# Option 1: Create directly via kubectl CLI (Recommended):
#   kubectl create secret generic pulse-secrets \
#     --namespace=pulse-attendance \
#     --from-literal=MONGODB_URI="mongodb+srv://<username>:<password>@cluster0.tndv2de.mongodb.net/pulse-attendance?retryWrites=true&w=majority" \
#     --from-literal=JWT_SECRET="<your-64-character-hex-secret>"
#
# Option 2: Copy this file to a local non-committed secret.yaml, base64 encode your values, and apply:
#   echo -n "your-connection-string" | base64
#   kubectl apply -f secret.yaml
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: pulse-secrets
  namespace: pulse-attendance
  labels:
    app.kubernetes.io/part-of: pulse-attendance
type: Opaque
stringData:
  # MongoDB Atlas managed cluster connection string
  MONGODB_URI: "mongodb+srv://<DB_USER>:<DB_PASSWORD>@cluster0.tndv2de.mongodb.net/pulse-attendance?retryWrites=true&w=majority"
  # 256-bit HMAC SHA-256 secret key for signing JWT tokens
  JWT_SECRET: "REPLACE_WITH_YOUR_64_CHARACTER_HEX_OR_BASE64_JWT_SECRET"
